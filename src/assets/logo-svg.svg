<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="forestGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="metallicSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer Badging Rings -->
  <g filter="url(#shadow)">
    <circle cx="250" cy="250" r="235" fill="url(#forestGreen)" />
    <circle cx="250" cy="250" r="222" fill="none" stroke="url(#metallicSilver)" stroke-width="6" />
    <circle cx="250" cy="250" r="210" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  </g>

  <!-- Vertical Pinstripes Background -->
  <g stroke="#e2e8f0" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="120" x2="100" y2="380" />
    <line x1="140" y1="85"  x2="140" y2="415" />
    <line x1="180" y1="65"  x2="180" y2="435" />
    <line x1="220" y1="52"  x2="220" y2="448" />
    <line x1="250" y1="48"  x2="250" y2="452" stroke="#0f5132" stroke-width="3" opacity="0.25" />
    <line x1="280" y1="52"  x2="280" y2="448" />
    <line x1="320" y1="65"  x2="320" y2="435" />
    <line x1="360" y1="85"  x2="360" y2="415" />
    <line x1="400" y1="120" x2="400" y2="380" />
  </g>

  <circle cx="250" cy="250" r="185" fill="none" stroke="#052e16" stroke-width="2" stroke-dasharray="6,5" opacity="0.3" />

  <!-- Monogram TSEC Core Interlocking Letters -->
  <g fill="url(#forestGreen)">
    <!-- Letter T -->
    <rect x="105" y="105" width="290" height="34" rx="8" />
    <rect x="233" y="105" width="34" height="290" rx="8" />

    <!-- Left Arcs (S / C) -->
    <path d="M 230 152 A 90 90 0 0 0 140 242 L 172 242 A 58 58 0 0 1 230 184 Z" />
    <path d="M 140 258 A 90 90 0 0 0 230 348 L 230 316 A 58 58 0 0 1 172 258 Z" />

    <!-- Right Arcs (S / E) -->
    <path d="M 270 184 A 58 58 0 0 1 328 242 L 360 242 A 90 90 0 0 0 270 152 Z" />
    <path d="M 270 316 A 58 58 0 0 0 328 258 L 360 258 A 90 90 0 0 1 270 348 Z" />

    <!-- Connecting Crossbars -->
    <rect x="155" y="235" width="75" height="30" rx="5" />
    <rect x="270" y="235" width="75" height="30" rx="5" />

    <!-- Accent Dots -->
    <circle cx="185" cy="202" r="7" fill="#10b981" />
    <circle cx="315" cy="298" r="7" fill="#10b981" />
  </g>
</svg>
